name: reference_admin
description: "Product-neutral Flutter admin console for the flutter-firebase-app reference implementation."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  reference_shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
